    <!-- SCRIPT CORRIGÉ POUR LES CARTES BANCAIRES -->
    <script>
    // Gestion des types de cartes
    document.querySelectorAll('.card-type').forEach(type => {
        type.addEventListener('click', function() {
            document.querySelectorAll('.card-type').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
        });
    });

    // Formatage des champs de carte
    document.querySelector('.card-number').addEventListener('input', function(e) {
        let value = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
        let formatted = '';
        for (let i = 0; i < value.length; i++) {
            if (i > 0 && i % 4 === 0) formatted += ' ';
            formatted += value[i];
        }
        e.target.value = formatted.substring(0, 19);
    });

    document.querySelector('.card-expiry').addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length >= 2) {
            value = value.substring(0, 2) + '/' + value.substring(2, 4);
        }
        e.target.value = value.substring(0, 5);
    });

    document.querySelector('.card-cvv').addEventListener('input', function(e) {
        e.target.value = e.target.value.replace(/\D/g, '').substring(0, 3);
    });

    document.querySelector('.card-holder').addEventListener('input', function(e) {
        e.target.value = e.target.value.toUpperCase();
    });

    // GESTION DU FORMULAIRE D'INSCRIPTION
    document.getElementById('inscriptionForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Récupération des données
        const nom = document.getElementById('nom').value;
        const prenom = document.getElementById('prenom').value;
        const age = parseInt(document.getElementById('age').value);
        const sexe = document.getElementById('sexe').value;
        const taille = parseFloat(document.getElementById('taille').value);
        const poids = parseFloat(document.getElementById('poids').value);
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        // Validation
        if (!nom || !prenom || !age || !sexe || !taille || !poids || !email || !password) {
            alert('Veuillez remplir tous les champs obligatoires');
            return;
        }

        // Vérifier si l'email existe déjà
        if (GYMDB.getMembreParEmail(email)) {
            alert('Un compte avec cet email existe déjà');
            return;
        }
        
        // CALCUL IMC
        const imc = calculerIMC(poids, taille);
        const categorie = determinerCategorieIMC(imc);
        
        // CRÉATION DU MEMBRE DANS LA BASE DE DONNÉES
        const nouveauMembre = GYMDB.ajouterMembre({
            nom,
            prenom,
            age,
            sexe,
            taille,
            poids,
            imc: imc.toFixed(2),
            categorie_imc: categorie.texte,
            email,
            password: btoa(password), // Chiffrement basique
            telephone: '',
            adresse: '',
            objectif: 'forme'
        });

        // CRÉATION DE L'ABONNEMENT
        const abonnement = GYMDB.ajouterAbonnement({
            membre_id: nouveauMembre.id,
            type: 'decouverte',
            prix: 29,
            duree: 30, // jours
            date_fin: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString()
        });

        // ENREGISTREMENT DU PAIEMENT
        const paiement = GYMDB.enregistrerPaiement({
            membre_id: nouveauMembre.id,
            abonnement_id: abonnement.id,
            montant: 29,
            methode: 'carte',
            statut: 'completé'
        });

        // SAUVEGARDE IMC
        GYMDB.sauvegarderIMC({
            membre_id: nouveauMembre.id,
            imc: imc,
            poids: poids,
            taille: taille,
            categorie: categorie.texte
        });

        // CONNEXION AUTOMATIQUE ET REDIRECTION
        localStorage.setItem('userLoggedIn', 'true');
        localStorage.setItem('currentUser', JSON.stringify(nouveauMembre));
        
        // REDIRECTION VERS LA PAGE COMPTE
        alert('✅ Inscription réussie ! Redirection vers votre compte...');
        window.location.href = 'compte.html';
    });
    
    // FONCTION DE CALCUL IMC
    function calculerIMC(poids, taille) {
        return poids / (taille * taille);
    }
    
    // FONCTION DE DÉTERMINATION DE CATÉGORIE IMC
    function determinerCategorieIMC(imc) {
        if (imc < 18.5) {
            return { texte: 'Sous-poids', couleur: '#ffcc00' };
        } else if (imc >= 18.5 && imc <= 24.9) {
            return { texte: 'Poids normal', couleur: '#4CAF50' };
        } else if (imc >= 25 && imc <= 29.9) {
            return { texte: 'Surpoids', couleur: '#FF9800' };
        } else {
            return { texte: 'Obésité', couleur: '#F44336' };
        }
    }

    // CALCUL AUTOMATIQUE QUAND LA TAILLE OU LE POIDS CHANGE
    document.getElementById('taille').addEventListener('input', calculerIMCAuto);
    document.getElementById('poids').addEventListener('input', calculerIMCAuto);
    
    function calculerIMCAuto() {
        const taille = parseFloat(document.getElementById('taille').value);
        const poids = parseFloat(document.getElementById('poids').value);
        
        if (taille && poids && taille > 1 && poids > 30) {
            const imc = calculerIMC(poids, taille);
            const categorie = determinerCategorieIMC(imc);
            
            // Afficher un aperçu
            const apercu = document.getElementById('apercuIMC') || document.createElement('div');
            apercu.id = 'apercuIMC';
            apercu.innerHTML = `
                <div style="background: ${categorie.couleur}; color: white; padding: 10px; border-radius: 5px; margin: 10px 0; text-align: center;">
                    <strong>IMC estimé: ${imc.toFixed(2)}</strong> - ${categorie.texte}
                </div>
            `;
            
            const formulaire = document.getElementById('inscriptionForm');
            if (!document.getElementById('apercuIMC')) {
                formulaire.insertBefore(apercu, document.querySelector('.payment-section'));
            } else {
                document.getElementById('apercuIMC').innerHTML = apercu.innerHTML;
            }
        }
    }
</script>
